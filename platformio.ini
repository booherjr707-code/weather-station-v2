; Two builds of the same program:
;   pio run -e gift -t upload   gift units: phone setup, no Home Assistant
;   pio run -e home -t upload   James's station: also publishes to Home
;                               Assistant (needs src/secrets.h with MQTT login)

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit GFX Library@^1.11.9
    tzapu/WiFiManager@^2.0.17

[env:gift]

[env:home]
build_flags = -DUSE_MQTT
